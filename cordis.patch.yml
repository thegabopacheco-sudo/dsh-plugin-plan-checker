# dsh-plugin-plan-checker — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "plancheck".
# Tools resultantes: mcp__plancheck__* (ver README).
- insert:
    - id: mcp-plan-checker
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: plancheck
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/plan-checker/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
